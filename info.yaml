# Tiny Tapeout project information
project:
  title:        "Ternary-158 Accelerator Engine"
  author:       "riyanlord2026-dev"
  discord:      ""
  description:  "A multiplier-less ternary AI core processing unit."
  language:     "Verilog"
  clock_hz:     10000000

  # How many tiles your design occupies?
  tiles: "1x1"

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_example"

  # List your project's source files here.
  source_files:
    - "project.v"

# The pinout of your project. Use descriptive names as a sequential list of 8 items.
pinout:
  # Inputs (Your 8-bit image pixel / activation value lines)
  ui:
    - "activation_0"
    - "activation_1"
    - "activation_2"
    - "activation_3"
    - "activation_4"
    - "activation_5"
    - "activation_6"
    - "activation_7"

  # Outputs (The top 8 bits of your 32-bit internal math tally)
  uo:
    - "accum_out_24"
    - "accum_out_25"
    - "accum_out_26"
    - "accum_out_27"
    - "accum_out_28"
    - "accum_out_29"
    - "accum_out_30"
    - "accum_out_31"

  # Bidirectional pins (Pins 0 and 1 take your 2-bit ternary weight)
  uio:
    - "weight_0"
    - "weight_1"
    - "unused_2"
    - "unused_3"
    - "unused_4"
    - "unused_5"
    - "unused_6"
    - "unused_7"

# Do not change!
yaml_version: 6
