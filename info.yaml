# Tiny Tapeout project information
project:
  title:        "Ternary-158 Accelerator Engine" # Add your project name
  author:       "riyanlord2026-dev"              # Add your developer handle
  discord:      ""                               # Optional
  description:  "A multiplier-less ternary AI core processing unit." # Add a brief description
  language:     "Verilog"
  clock_hz:     10000000                         # Sets clock tracking baseline to 10MHz


  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x1"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_example"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs (Your 8-bit image pixel / activation value lines)
  ui[0]: "activation_0"
  ui[1]: "activation_1"
  ui[2]: "activation_2"
  ui[3]: "activation_3"
  ui[4]: "activation_4"
  ui[5]: "activation_5"
  ui[6]: "activation_6"
  ui[7]: "activation_7"

  # Outputs (The top 8 bits of your 32-bit internal math tally)
  uo[0]: "accum_out_24"
  uo[1]: "accum_out_25"
  uo[2]: "accum_out_26"
  uo[3]: "accum_out_27"
  uo[4]: "accum_out_28"
  uo[5]: "accum_out_29"
  uo[6]: "accum_out_30"
  uo[7]: "accum_out_31"

  # Bidirectional pins (Pins 0 and 1 take your 2-bit ternary weight)
  uio[0]: "weight_0"
  uio[1]: "weight_1"
  uio[2]: "unused_2"
  uio[3]: "unused_3"
  uio[4]: "unused_4"
  uio[5]: "unused_5"
  uio[6]: "unused_6"
  uio[7]: "unused_7"

# Do not change!
yaml_version: 6
